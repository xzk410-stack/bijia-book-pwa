<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#356859"><title>刪除旅伴帳號</title><style>*{box-sizing:border-box}body{margin:0;background:#fffaf6;color:#25322d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;min-height:100vh}.wrap{max-width:620px;margin:auto;padding:30px 16px 50px}.card{background:#fff;border:1px solid #e7e2dc;border-radius:24px;padding:22px;box-shadow:0 12px 34px rgba(53,104,89,.08)}h1{margin:0 0 8px;font-size:28px}p,li{line-height:1.7;color:#65706b}label{display:grid;gap:6px;margin:12px 0;font-size:13px;font-weight:700}input{width:100%;padding:12px 13px;border:1px solid #dce3df;border-radius:13px;font:inherit}.btn{width:100%;border:0;border-radius:14px;padding:13px;font:inherit;font-weight:800;cursor:pointer}.primary{background:#356859;color:white}.danger{background:#b94a48;color:white}.ghost{display:block;text-align:center;color:#557166;text-decoration:none;margin-top:12px}.msg{margin-top:12px;padding:10px 12px;border-radius:12px;background:#fff6df;color:#765d2c;font-size:13px;line-height:1.6}.hidden{display:none}</style></head><body><main class="wrap"><section class="card"><h1>刪除旅伴帳號</h1><p>永久刪除後，旅伴帳號以及屬於你的行程、私人行李、待辦、支出與你建立的共用內容會依資料關聯一併移除，且無法復原。</p><div id="loginBox"><h2>先登入旅伴帳號</h2><label>Email<input id="email" type="email" autocomplete="email"></label><label>密碼<input id="password" type="password" autocomplete="current-password"></label><button id="loginBtn" class="btn primary">登入</button></div><div id="deleteBox" class="hidden"><p id="who"></p><p><strong>確認要永久刪除：</strong>請輸入「刪除帳號」。</p><label>確認文字<input id="confirmText" placeholder="刪除帳號"></label><button id="deleteBtn" class="btn danger">永久刪除旅伴帳號</button></div><div id="msg" class="msg hidden"></div><a class="ghost" href="https://save-radar-gold.vercel.app/hub/delete-account">返回刪除入口</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://dfvrlddywisvlnsqdjuf.supabase.co','sb_publishable_RO7yssf3v-kRdtI12fVx8w_gnpcKK5I');const $=id=>document.getElementById(id);function showMsg(t){$('msg').textContent=t;$('msg').classList.toggle('hidden',!t)}function showSession(s){$('loginBox').classList.toggle('hidden',!!s);$('deleteBox').classList.toggle('hidden',!s);$('who').textContent=s?'目前登入：'+(s.user.email||''):''}async function init(){const{data}=await sb.auth.getSession();showSession(data.session)}$('loginBtn').onclick=async()=>{showMsg('');const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return showMsg('請輸入 Email 和密碼。');$('loginBtn').disabled=true;const{data,error}=await sb.auth.signInWithPassword({email,password});$('loginBtn').disabled=false;if(error)return showMsg(error.message||'登入失敗');showSession(data.session)};$('deleteBtn').onclick=async()=>{if($('confirmText').value.trim()!=='刪除帳號')return showMsg('請輸入「刪除帳號」再繼續。');$('deleteBtn').disabled=true;showMsg('刪除中…');const{data,error}=await sb.functions.invoke('delete-my-account',{body:{confirm:true}});if(error||!data?.ok){$('deleteBtn').disabled=false;return showMsg('目前無法完成刪除，你的資料尚未被刪除。')}try{await sb.auth.signOut()}catch{}showSession(null);showMsg('旅伴帳號與資料已永久刪除。')};init();</script></body></html>
