<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F8F4EC">
<title>比價簿</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:#f8f4ec;color:#18372b}body{overflow:hidden}.shell{height:100%;display:flex;flex-direction:column}.topbar{display:none;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;background:rgba(255,255,255,.97);border-bottom:1px solid #e7e2d8}.topbar.show{display:flex}.account{min-width:0}.account b{display:block;font-size:13px}.account small{display:block;color:#7d857e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}.tools{display:flex;align-items:center;gap:6px}.tools button{border:1px solid #dde6df;background:#fff;border-radius:11px;padding:7px 9px;font-size:11px;font-weight:750;color:#52635a}.sync{color:#2f7654!important;background:#eef7f0!important;border-color:#d5e8da!important}.sync.warn{color:#906223!important;background:#fff7e8!important;border-color:#f0dfb8!important}iframe{border:0;width:100%;flex:1;background:#f8f4ec}.auth{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:linear-gradient(180deg,#fbf8f0,#f1f5ef);z-index:20;overflow:auto}.auth.hidden{display:none}.card{width:min(400px,100%);background:#fff;border:1px solid #e3e5df;border-radius:28px;padding:24px;box-shadow:0 18px 50px rgba(53,76,61,.11)}.brand{text-align:center;margin-bottom:18px}.logo{width:72px;height:72px;border-radius:22px;margin:0 auto 12px;display:grid;place-items:center;background:linear-gradient(145deg,#eaf4ec,#fff5e8);font-size:35px}.brand h1{font-size:28px;margin:0 0 5px}.brand p{font-size:13px;color:#747e77;line-height:1.6;margin:0}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f3f4ef;border-radius:14px;padding:4px;margin-bottom:14px}.tabs button{border:0;background:transparent;padding:10px;border-radius:11px;font-weight:800;color:#778079}.tabs button.on{background:#fff;color:#397656;box-shadow:0 3px 10px rgba(60,90,70,.08)}label{display:block;font-size:12px;color:#70786f;margin:10px 0 5px}input{width:100%;border:1px solid #dde1db;border-radius:14px;padding:12px 13px;outline:none;font:inherit}.primary{width:100%;border:0;border-radius:15px;padding:13px;background:linear-gradient(135deg,#4f8b68,#397656);color:#fff;font-weight:850;font-size:15px;margin-top:14px}.link{width:100%;border:0;background:transparent;color:#397656;font-weight:750;padding:10px;margin-top:4px}.msg{font-size:12px;line-height:1.55;margin-top:10px;color:#765927;background:#fff7e5;border:1px solid #f2e2b9;padding:10px 11px;border-radius:13px}.migration{margin-top:14px;border-top:1px solid #eceee8;padding-top:14px}.migration h3{font-size:13px;margin:0 0 6px}.migration p{font-size:11px;color:#7b817c;line-height:1.55;margin:0 0 9px}.minirow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.minirow button{display:flex;align-items:center;justify-content:center;border:1px solid #dfe4de;background:#fff;color:#4f5c54;border-radius:12px;padding:9px;font-size:12px;font-weight:750}.status{font-size:11px;color:#7b817c;margin-top:8px;text-align:center}@media(max-width:520px){.topbar{padding:8px}.account small{max-width:145px}.tools button{padding:7px;font-size:10px}.card{padding:20px;border-radius:24px}}
</style>
</head>
<body>
<div class="shell">
  <div id="topbar" class="topbar">
    <div class="account"><b>比價簿 · 雲端版</b><small id="accountEmail"></small></div>
    <div class="tools"><button id="cloudState" class="sync">雲端同步</button><button onclick="document.getElementById('backupFile').click()">匯入</button><button onclick="logout()">登出</button></div>
  </div>
  <iframe id="appFrame" src="./app.html" hidden title="比價簿"></iframe>
</div>
<section id="auth" class="auth">
  <div class="card">
    <div class="brand"><div class="logo">🔎</div><h1>比價簿</h1><p>與收藏雷達共用同一組 Email／密碼。<br>登入後價格資料會自動同步到雲端。</p></div>
    <div class="tabs"><button id="loginTab" class="on" onclick="setMode('login')">登入</button><button id="signupTab" onclick="setMode('signup')">註冊</button></div>
    <div id="nameWrap" hidden><label>暱稱</label><input id="displayName" placeholder="輸入暱稱"></div>
    <label>Email</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com">
    <label>密碼</label><input id="password" type="password" minlength="6" autocomplete="current-password" placeholder="至少 6 個字元">
    <div id="message" class="msg" hidden></div>
    <button id="submitBtn" class="primary" onclick="submitAuth()">登入</button>
    <button class="link" onclick="resetPassword()">忘記密碼？</button>
    <div class="migration"><h3>以前已經有比價資料？</h3><p>這個網址和原本比價簿是同一個網站來源，舊的本機資料會在第一次登入時自動合併上雲端；Android 更新版也會嘗試讀取原本 App 的最新自動備份。</p><div class="minirow"><button onclick="document.getElementById('backupFile').click()">匯入 JSON 備份</button><button onclick="location.reload()">重新檢查資料</button></div><div id="syncStatus" class="status"></div></div>
  </div>
</section>
<input id="backupFile" type="file" accept="application/json,.json" hidden>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./cloud.js"></script>
</body>
</html>
