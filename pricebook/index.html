<script>
// Android 原生返回鍵是在外層 index.html 收到；實際畫面在同網域 iframe 裡。
// 轉送給 app.html 的返回處理，避免按返回鍵時 Activity 直接結束、跳回手機主畫面。
window.handleAndroidBack = function(){
  try{
    const frame = document.getElementById('appFrame');
    const handler = frame && frame.contentWindow && frame.contentWindow.handleAndroidBack;
    return typeof handler === 'function' ? !!handler.call(frame.contentWindow) : false;
  }catch(e){
    return false;
  }
};

// Android ML Kit OCR 的結果在頂層 WebView 回來，再安全轉交給同網域的 app iframe。
window.onOrderOcrNativeResult = function(payload){
  try{
    const frame=document.getElementById('appFrame');
    const handler=frame&&frame.contentWindow&&frame.contentWindow.onOrderOcrResult;
    if(typeof handler==='function') handler.call(frame.contentWindow,payload);
  }catch(e){}
};

// 手機版「新增價格紀錄」曾因 grid 的最小內容寬度把欄位撐出畫面。
// 由外層同網域頁面補上一層安全 CSS；每次 iframe 重新載入都會重新套用。
function installPricebookMobileLayoutFix(){
  try{
    const frame=document.getElementById('appFrame');
    const doc=frame&&frame.contentDocument;
    if(!doc||!doc.head||doc.getElementById('mobile-record-layout-fix'))return;
    const style=doc.createElement('style');
    style.id='mobile-record-layout-fix';
    style.textContent=`
      #recordModal .form-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important}
      #recordModal .field,#recordModal .field.full{min-width:0!important;max-width:100%!important}
      #recordModal input,#recordModal select,#recordModal textarea{min-width:0!important;max-width:100%!important}
      #recordModal .input-action{min-width:0!important;max-width:100%!important;display:grid!important;grid-template-columns:minmax(0,1fr) auto!important;gap:8px!important;align-items:center!important}
      #recordModal .input-action input{min-width:0!important;width:100%!important}
      @media(max-width:520px){
        #recordModal .sheet{width:100%!important;padding-left:16px!important;padding-right:16px!important}
        #recordModal .form-grid{grid-template-columns:minmax(0,1fr)!important}
        #recordModal .field.full{grid-column:1!important}
        #recordModal .input-action{grid-template-columns:minmax(0,1fr)!important}
        #recordModal .input-action .btn{width:100%!important}
        #recordModal input[type=file]{width:100%!important;max-width:100%!important}
      }
    `;
    doc.head.appendChild(style);
  }catch(e){}
}

function installPricebookEnhancements(){
  installPricebookMobileLayoutFix();
  try{
    const frame=document.getElementById('appFrame');
    const doc=frame&&frame.contentDocument;
    if(!doc||!doc.body||doc.getElementById('pricebook-enhancements-script'))return;
    const script=doc.createElement('script');
    script.id='pricebook-enhancements-script';
    script.src='./enhancements.js?v=20260914-quick1';
    doc.body.appendChild(script);
    const uxScript=doc.createElement('script');
    uxScript.id='pricebook-ux-169-script';
    uxScript.src='./ux-1.6.9.js?v=unit-sync-20260915';
    doc.body.appendChild(uxScript);
  }catch(e){}
}
const pricebookFrame=document.getElementById('appFrame');
if(pricebookFrame){
  pricebookFrame.addEventListener('load',installPricebookEnhancements);
  installPricebookEnhancements();
}
</script>
