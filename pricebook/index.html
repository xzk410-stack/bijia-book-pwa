<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5ef">
<title>比價簿</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:#f7f5ef;color:#193a2d}button,input{font:inherit}button{cursor:pointer}body{overflow:hidden}.shell{height:100%;display:flex;flex-direction:column}.topbar{display:none;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;background:rgba(255,255,255,.97);border-bottom:1px solid #e7e2d8}.topbar.show{display:flex}.account{min-width:0}.account b{display:block;font-size:13px}.account small{display:block;color:#7d857e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}.tools{display:flex;align-items:center;gap:6px}.tools button{border:1px solid #dde6df;background:#fff;border-radius:11px;padding:7px 9px;font-size:11px;font-weight:750;color:#52635a}.sync{color:#2f7654!important;background:#eef7f0!important;border-color:#d5e8da!important}iframe{border:0;width:100%;flex:1;background:#f8f4ec}
.auth{position:fixed;inset:0;display:flex;justify-content:center;align-items:flex-start;padding:max(22px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));background:linear-gradient(180deg,#fbfaf6 0%,#f2f6f1 100%);z-index:20;overflow:auto}.auth.hidden{display:none}.card{width:min(420px,100%);margin:auto 0;background:rgba(255,255,255,.98);border:1px solid #e4e7e1;border-radius:26px;padding:22px;box-shadow:0 18px 52px rgba(48,78,61,.10)}
.brand{text-align:center;margin-bottom:16px}.logo{width:64px;height:64px;border-radius:20px;margin:0 auto 10px;display:grid;place-items:center;background:linear-gradient(145deg,#e7f2e9,#fff5e9);font-size:31px;box-shadow:inset 0 0 0 1px rgba(74,117,88,.04)}.brand h1{font-size:26px;line-height:1.2;margin:0 0 7px;letter-spacing:-.02em}.brand p{font-size:12.5px;color:#707b73;line-height:1.55;margin:0}.sharedBadge{display:inline-flex;align-items:center;gap:5px;margin-top:9px;padding:6px 9px;border-radius:999px;background:#f1f7f2;color:#447158;font-size:11px;font-weight:800}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f2f4ef;border-radius:14px;padding:4px;margin-bottom:15px}.tabs button{border:0;background:transparent;padding:9px 10px;border-radius:11px;font-weight:800;color:#778079}.tabs button.on{background:#fff;color:#397656;box-shadow:0 3px 10px rgba(60,90,70,.08)}label{display:block;font-size:12px;color:#68736b;margin:10px 0 5px;font-weight:700}input{width:100%;border:1px solid #dbe1db;border-radius:14px;padding:12px 13px;outline:none;background:#fff;color:#21352b;transition:border-color .15s,box-shadow .15s}input:focus{border-color:#86ad95;box-shadow:0 0 0 3px rgba(74,130,94,.10)}.primary{width:100%;border:0;border-radius:15px;padding:13px;background:linear-gradient(135deg,#4f8b68,#397656);color:#fff;font-weight:850;font-size:15px;margin-top:14px;box-shadow:0 8px 20px rgba(57,118,86,.18)}.primary:disabled,.google:disabled{opacity:.62;cursor:default}.link{width:100%;border:0;background:transparent;color:#397656;font-weight:750;padding:9px;margin-top:3px}.msg{font-size:12px;line-height:1.55;margin-top:10px;color:#765927;background:#fff7e5;border:1px solid #f2e2b9;padding:10px 11px;border-radius:13px}.divider{display:flex;align-items:center;gap:10px;color:#989f99;font-size:11px;margin:10px 0}.divider:before,.divider:after{content:"";height:1px;background:#eceee8;flex:1}.google{display:flex;width:100%;border:1px solid #dfe4de;background:#fff;border-radius:15px;padding:12px 13px;font-size:14px;font-weight:850;color:#34463c;align-items:center;justify-content:center;gap:9px;box-shadow:0 2px 8px rgba(53,76,61,.04)}.googleMark{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;border:1px solid #e0e4e0;font-size:14px;background:#fff;font-weight:900;color:#4285f4}
.migration{margin-top:14px;border:1px solid #e7ebe6;border-radius:14px;background:#fafbf9;overflow:hidden}.migration summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;cursor:pointer;font-size:12px;font-weight:800;color:#58655d}.migration summary::-webkit-details-marker{display:none}.migration summary:after{content:"＋";font-size:17px;line-height:1;color:#819087}.migration[open] summary:after{content:"－"}.migrationBody{border-top:1px solid #edf0eb;padding:11px 12px 12px}.migrationBody p{font-size:11px;color:#7b817c;line-height:1.55;margin:0 0 9px}.minirow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.minirow button{display:flex;align-items:center;justify-content:center;border:1px solid #dfe4de;background:#fff;color:#4f5c54;border-radius:12px;padding:9px;font-size:12px;font-weight:750}.status{font-size:11px;color:#7b817c;margin-top:8px;text-align:center}.legal{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:13px;font-size:11px}.legal a{color:#6b756e;text-decoration:none;font-weight:700}
@media(max-width:520px){.auth{padding-left:14px;padding-right:14px}.card{padding:19px 18px;border-radius:23px}.logo{width:60px;height:60px;border-radius:19px;font-size:29px}.brand h1{font-size:24px}.brand{margin-bottom:14px}.topbar{padding:8px}.account small{max-width:145px}.tools button{padding:7px;font-size:10px}.minirow{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <div id="topbar" class="topbar">
    <div class="account"><b>比價簿 · 雲端版</b><small id="accountEmail"></small></div>
    <div class="tools"><button id="cloudState" class="sync">雲端同步</button><button type="button" onclick="document.getElementById('backupFile').click()">匯入</button><button type="button" onclick="logout()">登出</button></div>
  </div>
  <iframe id="appFrame" src="./app.html" hidden title="比價簿"></iframe>
</div>
<section id="auth" class="auth">
  <div class="card">
    <div class="brand">
      <div class="logo">🔎</div>
      <h1>比價簿</h1>
      <p>記下每次看到的價格，之後一眼知道哪裡買最划算。</p>
      <div class="sharedBadge">☁️ 與收藏雷達共用登入帳號</div>
    </div>

    <div class="tabs">
      <button id="loginTab" class="on" type="button" onclick="setMode('login')">登入</button>
      <button id="signupTab" type="button" onclick="setMode('signup')">註冊</button>
    </div>

    <div id="nameWrap" hidden><label>暱稱</label><input id="displayName" placeholder="輸入暱稱" autocomplete="nickname"></div>
    <label>Email</label><input id="email" type="email" autocomplete="email" inputmode="email" placeholder="name@example.com">
    <label>密碼</label><input id="password" type="password" minlength="6" autocomplete="current-password" placeholder="至少 6 個字元">
    <div id="message" class="msg" hidden></div>
    <button id="submitBtn" class="primary" type="button" onclick="submitAuth()">登入</button>
    <button class="link" type="button" onclick="resetPassword()">忘記密碼？</button>

    <div class="divider">或</div>
    <button class="google" type="button" onclick="signInWithGoogle()"><span class="googleMark">G</span><span>使用 Google 登入</span></button>

    <details class="migration">
      <summary>以前已經有比價資料？</summary>
      <div class="migrationBody">
        <p>舊的本機資料會在第一次登入時自動合併上雲端；如果手邊有 JSON 備份，也可以手動匯入，不會清空原資料。</p>
        <div class="minirow"><button type="button" onclick="document.getElementById('backupFile').click()">匯入 JSON 備份</button><button type="button" onclick="location.reload()">重新檢查資料</button></div>
        <div id="syncStatus" class="status"></div>
      </div>
    </details>

    <div class="legal"><a href="https://save-radar-gold.vercel.app/hub/privacy">隱私權</a><a href="https://save-radar-gold.vercel.app/hub/terms">使用說明</a><a href="https://save-radar-gold.vercel.app/delete-account">刪除帳號</a></div>
  </div>
</section>
<input id="backupFile" type="file" accept="application/json,.json" hidden>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./cloud.js"></script>
</body>
</html>
