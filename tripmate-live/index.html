/* Android v2.0 platform tuning */
body{font-family:"Noto Sans TC","Roboto","Segoe UI",sans-serif}
.topbar{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(255,250,246,.98);padding-top:12px}

.field input,.field select,.field textarea{border-radius:10px}

.navbtn{min-height:54px;border-radius:14px}.navbtn.active{background:var(--green2);color:var(--green)}
.fab{border-radius:18px;box-shadow:0 6px 16px rgba(53,104,89,.28)}

/* v1.5 B/C icon collections */
.icon-grid{grid-template-columns:repeat(3,1fr);gap:8px}
.icon-choice{padding:9px 6px 10px;text-align:center;border-radius:17px;min-width:0}

.icon-name{font-size:12px;line-height:1.25}
.icon-desc{font-size:9px;line-height:1.35;min-height:24px}

<script data-tripmate-fresh-ui>
(() => {
  const hideOldAndroidCard = () => {
    const all = [...document.querySelectorAll('body *')];
    for (const el of all) {
      const text = (el.textContent || '').replace(/\s+/g, ' ').trim();
      if (!/Android\s*1\.2\.7|定位修復版|安裝最新版/.test(text)) continue;
      let node = el;
      for (let i = 0; i < 5 && node.parentElement && node.parentElement !== document.body; i++) {
        const parent = node.parentElement;
        const pt = (parent.textContent || '').replace(/\s+/g, ' ').trim();
        if (pt.length <= 650) node = parent;
        else break;
      }
      node.style.display = 'none';
      break;
    }
  };
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', hideOldAndroidCard, {once:true});
  } else {
    hideOldAndroidCard();
  }
  setTimeout(hideOldAndroidCard, 250);
  setTimeout(hideOldAndroidCard, 1000);
})();
</script>
