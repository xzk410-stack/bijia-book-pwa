function tripListHtml(){const active=state.trips.filter(t=>!isTripArchived(t)),arch=state.trips.filter(isTripArchived);const card=t=>{const archived=isTripArchived(t),phase=tripPhase(t),owner=state.roles[t.id]==='owner',editable=['owner','editor'].includes(state.roles[t.id]);return `<div class="card ${state.trip?.id===t.id?'selected':''}"><div class="cardrow"><div class="cardicon">${archived?'📦':'🧳'}</div><div class="cardmain"><div class="rowbetween"><div class="cardtitle">${esc(t.title)}</div><span><span class="badge ${phase==='active'?'green':phase==='completed'?'blue':''}">${tripStatusLabel(t)}</span><span class="badge ${owner?'green':''}">${roleLabel(state.roles[t.id])}</span></span></div><div class="meta">${esc([t.destination,t.start_date&&t.end_date?t.start_date+' ～ '+t.end_date:'',t.base?'住宿：'+t.base:''].filter(Boolean).join(' · ')||'尚未填基本資訊')}</div><div class="actions"><button class="mini good" data-select-trip="${t.id}">${state.trip?.id===t.id?'目前查看':'開啟'}</button>${editable?`<button class="mini" data-edit-trip="${t.id}">編輯</button>`:''}${owner&&phase!=='completed'?(t.archived_at?`<button class="mini" data-restore-trip="${t.id}">叫回</button>`:`<button class="mini warn" data-archive-trip="${t.id}">封存</button>`):''}${owner?`<button class="mini danger" data-delete-trip="${t.id}">刪除</button>`:''}</div></div></div></div>`};const main=`<div class="sectionhead"><div><h2>目前／即將出發</h2><p>主清單只放現在與未來的旅行</p></div><button class="linkbtn" data-refresh>同步</button></div><div class="stack">${active.map(card).join('')||`<div class="empty"><b>目前沒有進行中或即將出發的旅行</b><span>按右下角＋建立下一趟。</span></div>`}</div>`;const library=arch.length?`<details style="margin-top:14px" ${state.trip&&isTripArchived(state.trip)?'open':''}><summary class="settingline"><div><b>📦 旅程庫</b><small>${arch.length} 趟已完成／封存 · 所有資料都保留</small></div><span>⌄</span></summary><div class="archive-note">旅行完成後會自動收進這裡；也可以手動封存暫時不想看的旅行。</div><div class="stack">${arch.map(card).join('')}</div></details>`:'';return main+library}
function loginHtml(){return `<div class="login-gate"><div class="hero"><div class="brandbig">🧳</div><div class="eyebrow">TRIP COMPANION</div><h2>歡迎回到旅伴</h2><p>這版直接使用原本的旅伴雲端資料庫。登入同一個帳號後，舊旅行、收藏、票券、行李與待辦都會回來。</p></div><div class="card login-card"><div class="authbox"><div class="field"><label>Email</label><input id="authEmail" type="email" autocomplete="email"></div><div class="field"><label>密碼</label><input id="authPassword" type="password" autocomplete="current-password"></div><button class="primarybtn wide" data-signin>登入原本帳號</button><button class="ghostbtn wide" data-signup>建立帳號</button><div class="meta">登入後才會顯示你的雲端資料，不會另外建立一套空資料。</div></div></div></div>`}
function renderPlaces(){const el=$('#placesView');if(!state.session){el.innerHTML=loginHtml();return}if(state.placeScope==='trip'&&!state.trip){el.innerHTML=needTripHtml();return}const list=state.placeScope==='library'?state.savedPlaces:state.places;const areas=['全部地區',...new Set(list.map(x=>x.area||'未分區'))],cats=['全部分類',...new Set(list.flatMap(x=>String(x.category||'').split(/[、,]/)).filter(Boolean))];let shown=list.filter(x=>{const hay=(x.name+' '+x.area+' '+x.category+' '+x.note).toLowerCase(),qv=state.placeSearch.trim().toLowerCase();const visited=state.placeScope==='library'?x.visited:x.done;return(!qv||hay.includes(qv))&&(state.placeStatus==='全部'||state.placeStatus==='已去'&&visited||state.placeStatus==='還想去'&&!visited)&&(state.placePriority==='全部'||x.priority===state.placePriority)&&(state.placeArea==='全部地區'||(x.area||'未分區')===state.placeArea)&&(state.placeCategory==='全部分類'||String(x.category||'').split(/[、,]/).includes(state.placeCategory))});el.innerHTML=`<div class="sectionhead"><div><h2>想去清單</h2><p>${state.placeScope==='library'?`收藏庫 ${state.savedPlaces.length} 筆，可跨旅行使用`:`本趟 ${state.places.length} 個地點`}</p></div></div><div class="seg"><button class="${state.placeScope==='library'?'active':''}" data-place-scope="library">收藏庫</button><button class="${state.placeScope==='trip'?'active':''}" data-place-scope="trip">本趟行程</button></div><div class="filterbox"><input class="soft-input" id="placeSearch" placeholder="搜尋店家、景點、備註" value="${esc(state.placeSearch)}"><div class="chips">${['還想去','已去','全部'].map(x=>`<button class="chip ${state.placeStatus===x?'active':''}" data-place-status="${x}">${x}</button>`).join('')}</div><div class="grid2"><select class="soft-input" id="placeArea">${areas.map(x=>`<option ${state.placeArea===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select class="soft-input" id="placeCategory">${cats.map(x=>`<option ${state.placeCategory===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div><div class="meta" style="margin:0 2px 8px">目前顯示 ${shown.length} 筆</div><div class="stack">${shown.map(placeCard).join('')||'<div class="empty"><div class="big">🔎</div><b>沒有符合條件的地點</b><span>換個搜尋字或篩選條件。</span></div>'}</div>`}
function placeCard(x){const visited=state.placeScope==='library'?x.visited:x.done,links=postUrls(x);return `<div class="card ${visited?'selected':''}"><div class="cardrow"><div class="cardicon">${visited?'✓':'📍'}</div><div class="cardmain"><div class="cardtitle ${visited?'done-title':''}">${esc(x.name)}</div><div class="meta">${esc([x.area,x.category,x.priority].filter(Boolean).join(' · '))}${state.placeScope==='trip'&&x.planned_date?' · '+fmtDate(x.planned_date)+(x.planned_time?' '+String(x.planned_time).slice(0,5):''):''}</div>${x.note?`<div class="note">${esc(x.note)}</div>`:''}<div class="actions"><button class="mini good" data-open-url="${esc(navigationUrl(x))}">導航</button>${sourceLinksHtml(x)}${state.placeScope==='library'?`<button class="mini" data-toggle-saved="${x.id}">${visited?'改回未去':'標記已去'}</button>${state.trip?`<button class="mini warn" data-add-to-trip="${x.id}">排進本趟</button>`:''}<button class="mini" data-edit-saved="${x.id}">編輯</button>`:`<button class="mini" data-toggle-place="${x.id}">${visited?'改回未去':'已去'}</button><button class="mini warn" data-schedule-place="${x.id}">${x.planned_date?'調整行程':'排入行程'}</button>${canEdit()?`<button class="mini" data-edit-place="${x.id}">編輯</button>`:''}`}<button class="mini danger" data-delete-${state.placeScope==='library'?'saved':'place'}="${x.id}">刪除</button></div></div></div></div>`}
function renderToday(){const el=$('#todayView');if(!state.session){el.innerHTML=loginHtml();return}if(!state.trip){el.innerHTML=needTripHtml();return}const dates=dateRange(),done=tripPhase(state.trip)==='completed';if(!state.today||!dates.includes(state.today))state.today=done?(state.trip.end_date||dates.at(-1)||''):chooseTodayDate();const ps=state.places.filter(x=>x.planned_date===state.today&&!x.skipped).map(x=>({...x,_kind:'place',_time:x.planned_time||'',_order:Number(x.sort_order||0)}));const ts=state.tickets.filter(x=>x.travel_date===state.today).map(x=>({...x,_kind:'ticket',_time:x.depart_time||'',_order:-1}));const rows=[...ts,...ps].sort((a,b)=>String(a._time||'99:99').localeCompare(String(b._time||'99:99'))||a._order-b._order);el.innerHTML=`<div class="hero"><div class="eyebrow">${done?'TRIP MEMORY':'DAILY PLAN'}</div><h2>${state.today?fmtDate(state.today):(done?'旅程回顧':'今天行程')}</h2><p>${done?'這趟旅行已完成；切換日期可以回看每天的票券與地點。資料都會保留。':'票券與地點合併成同一條時間軸；導航、原始貼文、班次與票券直接留在當天。'}</p></div><div class="datechips">${dates.map(d=>`<button class="datechip ${state.today===d?'active':''}" data-today-date="${d}">${fmtDate(d)}</button>`).join('')||'<span class="muted small">先替旅行設定日期</span>'}</div><div class="timeline" style="margin-top:10px">${rows.map(todayCard).join('')||`<div class="empty"><div class="big">☁️</div><b>這天還沒有安排</b><span>${done?'這天沒有留下排程資料。':'可以從「想去」挑一個地點排進這天，或按＋手動新增。'}</span></div>`}</div>`}
function todayCard(x){if(x._kind==='ticket')return `<div class="timeitem"><div class="timecard"><div class="time">${esc(String(x.depart_time||'票券').slice(0,5))}</div><div class="cardtitle">${ticketIcon(x)} ${esc(x.title||x.type||'票券')}</div><div class="meta">${esc([x.origin&&x.destination?x.origin+' → '+x.destination:'',x.service_no,x.terminal_platform,x.seat?'座位 '+x.seat:''].filter(Boolean).join(' · '))}</div>${x.booking_ref?`<div class="code-pill"><div><span class="small muted">訂位／取票碼</span><br><code>${esc(x.booking_ref)}</code></div><button class="mini good" data-copy-text="${encodeURIComponent(x.booking_ref)}">複製</button></div>`:''}${x.note?`<div class="note">${esc(x.note)}</div>`:''}${(x.ticket_url||x.attachment_path)?`<div class="actions">${x.ticket_url?`<button class="mini good" data-open-url="${esc(x.ticket_url)}">查看票券</button>`:''}${x.attachment_path?`<button class="mini good" data-open-attachment="${x.id}">查看附件</button>`:''}</div>`:''}</div></div>`;const links=sourceLinksHtml(x),editable=canEdit();return `<div class="timeitem"><div class="timecard"><div class="rowbetween"><div><div class="time">${esc(String(x.planned_time||'未定時間').slice(0,5))}</div><div class="cardtitle ${x.done?'done-title':''}">${esc(x.name)}</div><div class="meta">${esc([x.area,x.category].filter(Boolean).join(' · '))}</div></div>${editable?`<input type="checkbox" data-toggle-place="${x.id}" ${x.done?'checked':''}>`:x.done?'<span class="badge green">已去</span>':''}</div>${x.note?`<div class="note">${esc(x.note)}</div>`:''}<div class="actions"><button class="mini good" data-open-url="${esc(navigationUrl(x))}">導航</button>${links}${editable?`<button class="mini" data-schedule-place="${x.id}">調整行程</button><button class="mini" data-edit-place="${x.id}">編輯</button>`:''}</div>${!editable?'<div class="viewer-note">目前為僅查看權限</div>':''}</div></div>`}
function ticketIcon(x){return /住宿|飯店/i.test(x.type+' '+x.title)?'🏨':/飛機|航班|機票/.test(x.type+' '+x.title)?'✈️':/電車|新幹線|鐵路|車票/.test(x.type+' '+x.title)?'🚆':/巴士/.test(x.type+' '+x.title)?'🚌':'🎫'}
function renderTickets(){const el=$('#ticketsView');if(!state.session){el.innerHTML=loginHtml();return}if(!state.trip){el.innerHTML=needTripHtml();return}const editable=canEdit();el.innerHTML=`<div class="sectionhead"><div><h2>交通與票券</h2><p>機票、車票、住宿與預約都放這裡</p></div></div><div class="stack">${state.tickets.map(x=>`<div class="card"><div class="cardrow"><div class="cardicon">${ticketIcon(x)}</div><div class="cardmain"><div class="cardtitle">${esc(x.title||x.type||'票券')}</div><div class="meta">${esc([x.travel_date?fmtDate(x.travel_date):'',x.depart_time?String(x.depart_time).slice(0,5):'',x.arrive_time?'→ '+String(x.arrive_time).slice(0,5):'',x.service_no,x.origin&&x.destination?x.origin+' → '+x.destination:''].filter(Boolean).join(' · '))}</div>${(x.seat||x.terminal_platform)?`<div class="meta">${esc([x.seat?'座位 '+x.seat:'',x.terminal_platform?'航廈／月台／入口 '+x.terminal_platform:''].filter(Boolean).join(' · '))}</div>`:''}${x.booking_ref?`<div class="note"><b>訂位／取票：</b>${esc(x.booking_ref)}</div>`:''}${x.note?`<div class="note">${esc(x.note)}</div>`:''}<div class="actions">${x.origin?`<button class="mini good" data-open-url="${esc('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x.origin))}">導航</button>`:''}${x.ticket_url?`<button class="mini" data-open-url="${esc(x.ticket_url)}">票券連結</button>`:''}${x.attachment_path?`<button class="mini" data-open-attachment="${x.id}">查看票券</button>`:''}${editable?`<button class="mini" data-edit-ticket="${x.id}">編輯</button><button class="mini danger" data-delete-ticket="${x.id}">刪除</button>`:''}</div></div></div></div>`).join('')||'<div class="empty"><div class="big">🎟️</div><b>還沒有票券</b><span>按右下角＋新增機票、住宿或預約。</span></div>'}</div>`}
function renderMore(){const el=$('#moreView');if(!state.session){el.innerHTML=loginHtml();return}if(state.more==='hub'){const sums=Object.entries(state.expenses.reduce((a,x)=>(a[x.currency]=(a[x.currency]||0)+Number(x.amount||0),a),{})).map(([k,v])=>k+' '+money(v)).join(' · ')||'尚無';el.innerHTML=`<div class="hero"><div class="eyebrow">TOOLS</div><h2>旅行工具</h2><p>票券不塞設定、登入不塞設定；每件事回到它該在的位置。</p></div><div class="tool-grid"><button class="tool-card" data-go-more="luggage"><span class="tool-count">${state.luggage.filter(x=>x.done).length}/${state.luggage.length}</span><span class="tool-ico">🧳</span><b>我的行李</b><small>私人清單，只自己看得到</small></button><button class="tool-card" data-go-more="shopping"><span class="tool-count">${state.shopping.filter(x=>!x.done).length}</span><span class="tool-ico">🛍️</span><b>購物清單</b><small>伴手禮與必買</small></button><button class="tool-card" data-go-more="tasks"><span class="tool-count">${state.tasks.filter(x=>!x.done).length}</span><span class="tool-ico">☑️</span><b>我的待辦</b><small>行前、文件、預約</small></button><button class="tool-card" data-go-more="expenses"><span class="tool-ico">💰</span><b>旅行花費</b><small>${esc(sums)}</small></button><button class="tool-card" data-go-more="share"><span class="tool-ico">🤝</span><b>同行共享</b><small>邀朋友一起編輯</small></button><button class="tool-card" data-go-more="backup"><span class="tool-ico">🛟</span><b>完整備份</b><small>JSON 匯出／安全合併還原</small></button><button class="tool-card" data-go-more="settings"><span class="tool-ico">🎨</span><b>外觀</b><small>主題色與介面</small></button><button class="tool-card" data-signout><span class="tool-ico">↪️</span><b>登出</b><small>${esc(state.session.user.email||'目前帳號')}</small></button></div>`;return}if(!state.trip&&['luggage','shopping','tasks','expenses'].includes(state.more)){el.innerHTML=backHtml('旅行工具')+needTripHtml();return}if(state.more==='luggage')return renderLuggage(el);if(state.more==='shopping')return renderShopping(el);if(state.more==='tasks')return renderTasks(el);if(state.more==='expenses')return renderExpenses(el);if(state.more==='share')return renderShare(el);if(state.more==='backup')return renderBackup(el);if(state.more==='settings')return renderSettings(el)}function backHtml(title){return `<div class="backbar"><button data-go-more="hub">‹</button><b>${title}</b></div>`}

function fieldHtml(f,v){const val=v?.[f.name]??'';if(f.type==='select')return `<div class="field ${f.full?'wide':''}"><label>${esc(f.label)}</label><select name="${f.name}">${f.options.map(x=>`<option ${String(val)===String(x)?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`;if(f.type==='textarea')return `<div class="field ${f.full?'wide':''}"><label>${esc(f.label)}</label><textarea name="${f.name}">${esc(val)}</textarea></div>`;if(f.type==='file')return `<div class="field ${f.full?'wide':''}"><label>${esc(f.label)}</label><input name="${f.name}" type="file" ${f.accept?`accept="${esc(f.accept)}"`:''}></div>`;return `<div class="field ${f.full?'wide':''}"><label>${esc(f.label)}</label><input name="${f.name}" type="${f.type||'text'}" value="${esc(val)}" ${f.required?'required':''} ${f.step?`step="${f.step}"`:''}></div>`}function openForm(title,fields,values,onSave){currentForm={onSave};$('#formTitle').textContent=title;$('#formFields').innerHTML=fields.map(f=>fieldHtml(f,values)).join('');$('#formModal').classList.add('show')}function closeForm(){$('#formModal').classList.remove('show');currentForm=null}function confirmBox(title,html,fn){$('#confirmTitle').textContent=title;$('#confirmText').innerHTML=html;confirmAction=fn;$('#confirmModal').classList.add('show')}

function storageHeaders(contentType='application/json'){const h={apikey:SUPABASE_KEY};if(state.session?.access_token)h.Authorization='Bearer '+state.session.access_token;if(contentType)h['Content-Type']=contentType;return h}
function storagePath(path){return String(path||'').split('/').map(encodeURIComponent).join('/')}
async function uploadTicketAttachment(file){if(!state.trip||!state.session?.user)throw new Error('請先登入並選擇旅行');if(!file||!file.size)return '';if(file.size>10*1024*1024)throw new Error('附件最多 10MB');const ok=['image/jpeg','image/png','image/webp','application/pdf'];if(!ok.includes(file.type))throw new Error('只支援 JPG、PNG、WEBP 或 PDF');const ext=(file.name.split('.').pop()||({'image/jpeg':'jpg','image/png':'png','image/webp':'webp','application/pdf':'pdf'}[file.type]||'bin')).replace(/[^a-zA-Z0-9]/g,'').toLowerCase();const path=state.trip.id+'/'+uid()+'.'+ext;const r=await fetch(SUPABASE_URL+'/storage/v1/object/ticket-files/'+storagePath(path),{method:'POST',headers:{...storageHeaders(file.type),'x-upsert':'false'},body:file});const text=await r.text();if(!r.ok)throw new Error(text||'附件上傳失敗');return path}
async function deleteTicketAttachment(path){if(!path)return;const r=await fetch(SUPABASE_URL+'/storage/v1/object/ticket-files',{method:'DELETE',headers:storageHeaders(),body:JSON.stringify({prefixes:[path]})});if(!r.ok){const text=await r.text();console.warn('附件刪除失敗',text)}}
async function openTicketAttachment(id){const t=state.tickets.find(x=>x.id===id);if(!t?.attachment_path)return toast('這張票券沒有附件');setBusy(true,'開啟附件…');try{const r=await fetch(SUPABASE_URL+'/storage/v1/object/authenticated/ticket-files/'+storagePath(t.attachment_path),{headers:storageHeaders(null)});if(!r.ok)throw new Error((await r.text())||'附件讀取失敗');const blob=await r.blob();if(window.AndroidApp){const reader=new FileReader();reader.onload=()=>{try{const b64=String(reader.result||'').split(',')[1]||'';AndroidApp.openBase64((t.title||'票券'),blob.type||'application/octet-stream',b64)}catch(e){toast('附件開啟失敗')}};reader.readAsDataURL(blob)}else{const url=URL.createObjectURL(blob);window.open(url,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(url),60000)}}catch(e){toast(errText(e))}finally{setBusy(false)}}

function removeTicket(id){const t=state.tickets.find(x=>x.id===id);if(!t)return;confirmBox('刪除票券',`確定要刪除「<b>${esc(t.title||'這張票券')}</b>」嗎？${t.attachment_path?'<br>附加的票券檔案也會一起刪除。':''}`,async()=>{setBusy(true,'刪除票券…');try{if(t.attachment_path)await deleteTicketAttachment(t.attachment_path);await deleteRow('shared_tickets',id);$('#confirmModal').classList.remove('show');await loadTripData();render();toast('票券已刪除')}catch(e){toast(errText(e))}finally{setBusy(false)}})}
