<!doctype html>
<html lang="zh-Hant">
<head>

<title>我的消費簿</title>
<style>
:root{--bg:#f7f7fb;--card:#fff;--text:#1f2430;--muted:#737887;--accent:#6b7cfa;--accent2:#eef0ff;--border:#e8e9ef;--green-bg:#eaf7f0;--green:#28734f;--yellow-bg:#fff5d9;--yellow:#8a6412;--red-bg:#fdebed;--red:#b24b5c;--blue-bg:#eaf1ff;--blue:#4362b6;--shadow:0 12px 30px rgba(40,48,90,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:96px}.top{padding:18px 18px 6px;display:flex;justify-content:space-between;align-items:center}.title{font-size:28px;font-weight:850;letter-spacing:-.5px}.sub{font-size:13px;color:var(--muted);margin-top:4px}.avatar{width:40px;height:40px;border-radius:14px;background:var(--accent2);display:grid;place-items:center;font-weight:850;color:var(--accent)}.section{padding:10px 16px}.page{display:none}.page.active{display:block}.hero{background:linear-gradient(135deg,#fff,#f1f3ff);border:1px solid var(--border);border-radius:24px;padding:18px;box-shadow:var(--shadow)}.hero .label{color:var(--muted);font-size:13px}.hero .amount{font-size:34px;font-weight:900;margin:5px 0 16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#fff;border:1px solid var(--border);border-radius:16px;padding:10px}.stat b{display:block;font-size:16px}.stat span{font-size:12px;color:var(--muted)}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.q{border:1px solid var(--border);background:#fff;border-radius:18px;padding:12px 6px;text-align:center;font-size:12px}.q strong{display:block;font-size:18px}.row-head{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 10px}.row-head h3{margin:0;font-size:18px}.row-head button{border:0;background:transparent;color:var(--accent);font-weight:800}.search-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:10px}.searchbox{position:relative}.searchbox input{width:100%;border:1px solid var(--border);background:#fff;border-radius:15px;padding:12px 13px 12px 38px;outline:none}.searchbox span{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}.filter-btn{border:1px solid var(--border);background:#fff;border-radius:15px;padding:0 14px;font-weight:700}.filters{display:flex;gap:8px;overflow:auto;padding-bottom:4px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid var(--border);background:#fff;border-radius:99px;padding:8px 12px;font-size:12px}.chip.on{background:var(--accent2);color:var(--accent);border-color:#dfe3ff;font-weight:800}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:14px;margin-bottom:10px;box-shadow:0 6px 18px rgba(40,48,90,.035)}.card-main{cursor:pointer}.card-top{display:flex;justify-content:space-between;gap:12px}.name{font-size:16px;font-weight:800;line-height:1.35}.meta{font-size:12px;color:var(--muted);margin-top:4px}.money{text-align:right;white-space:nowrap}.money .money-label{font-size:10px;color:var(--muted)}.money b{display:block;font-size:17px;margin-top:2px}.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.badge{display:inline-flex;align-items:center;gap:4px;padding:5px 9px;border-radius:99px;font-size:11px;border:0}.badge.yellow{background:var(--yellow-bg);color:var(--yellow)}.badge.green{background:var(--green-bg);color:var(--green)}.badge.red{background:var(--red-bg);color:var(--red)}.badge.blue{background:var(--blue-bg);color:var(--blue)}.badge.gray{background:#f2f3f6;color:#666d79}.shipdate{font-size:12px;color:var(--muted);margin-top:10px}.payment-summary{display:flex;justify-content:space-between;gap:10px;align-items:end;border-top:1px solid var(--border);padding-top:11px;margin-top:11px}.payment-summary .left,.unpaid{font-size:12px;color:var(--muted)}.unpaid{text-align:right}.unpaid b{display:block;color:var(--red);font-size:15px}.actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1;padding:9px 10px;border-radius:12px;border:1px solid var(--border);background:#fff;font-weight:750}.actions .primary{background:var(--accent);color:#fff;border-color:var(--accent)}.actions .more{flex:0 0 43px}.empty{background:#fff;border:1px dashed var(--border);border-radius:18px;padding:28px 18px;text-align:center;color:var(--muted);font-size:13px}.field{margin-bottom:12px}.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:12px 13px;border-radius:14px;border:1px solid var(--border);background:#fff;outline:none}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.save{width:100%;border:0;border-radius:16px;padding:14px;background:var(--accent);color:#fff;font-weight:850;font-size:16px}.mini-note{font-size:12px;color:var(--muted);background:#fff;border:1px dashed var(--border);padding:10px;border-radius:14px}.setting{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px}.setting small{color:var(--muted)}.setting button{border:0;background:transparent;color:var(--accent);font-weight:800}.chart{height:150px;display:flex;align-items:flex-end;gap:10px;padding:14px 14px 30px;background:#fff;border:1px solid var(--border);border-radius:20px}.bar{flex:1;min-height:4px;background:linear-gradient(180deg,#9ca8ff,#6b7cfa);border-radius:10px 10px 4px 4px;position:relative}.bar span{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted)}.sheet-backdrop{position:fixed;inset:0;background:rgba(20,24,35,.38);display:none;align-items:flex-end;justify-content:center;z-index:30}.sheet-backdrop.show{display:flex}.sheet{width:min(430px,100%);max-height:86vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -16px 40px rgba(20,24,35,.18)}.sheet-handle{width:42px;height:5px;background:#d9dbe5;border-radius:99px;margin:0 auto 14px}.sheet-title{font-size:18px;font-weight:850;margin-bottom:4px}.sheet-sub{font-size:12px;color:var(--muted);margin-bottom:14px}.status-list{display:grid;gap:9px}.status-option{width:100%;padding:13px 14px;border-radius:15px;border:1px solid var(--border);background:#fff;text-align:left}.status-option.current{background:var(--accent2);color:var(--accent);font-weight:850}.sheet-cancel,.sheet-action{width:100%;margin-top:10px;padding:13px;border:0;border-radius:14px;font-weight:850}.sheet-cancel{background:#f3f4f8}.sheet-action{background:var(--accent);color:#fff}.sheet-action.secondary{background:#fff;color:var(--text);border:1px solid var(--border)}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}.detail-box{border:1px solid var(--border);border-radius:14px;padding:11px}.detail-box span{display:block;font-size:11px;color:var(--muted)}.detail-box b{display:block;margin-top:3px;font-size:14px}.detail-full{border-top:1px solid var(--border);padding-top:12px;margin-top:12px}.detail-full .row{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:6px 0}.detail-full .row span:first-child{color:var(--muted)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px calc(12px + env(safe-area-inset-bottom));z-index:20}.nav button{border:0;background:transparent;color:var(--muted);font-size:11px;padding:6px}.nav .active{color:var(--accent);font-weight:850}.nav .plus{width:48px;height:48px;border-radius:18px;background:var(--accent);color:#fff;font-size:25px;margin:-20px auto 0;box-shadow:0 9px 20px rgba(107,124,250,.35)}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><div class="title">我的消費簿</div><div class="sub">把付款、出貨、到貨一次管好</div></div><div class="avatar">帳</div></div>
  <main id="home" class="page active"><div class="section"><div class="hero"><div class="label">本月總消費</div><div class="amount" id="homeTotal">NT$0</div><div class="stats"><div class="stat"><span>已付款</span><b id="homePaid">0</b></div><div class="stat"><span>待付款</span><b id="homeUnpaid">0</b></div><div class="stat"><span>待到貨</span><b id="homeWaiting">0 筆</b></div></div></div><div class="quick"><div class="q"><strong id="qPay">0</strong>待付款</div><div class="q"><strong id="qShip">0</strong>待出貨</div><div class="q"><strong id="qTransit">0</strong>運送中</div><div class="q"><strong id="qPickup">0</strong>待取貨</div></div></div><div class="section"><div class="row-head"><h3>最近紀錄</h3><button onclick="go('records')">查看全部</button></div><div id="recent"></div></div></main>
  <main id="records" class="page"><div class="section"><div class="search-row"><div class="searchbox"><span>⌕</span><input id="searchInput" placeholder="搜尋商品、賣家、平台" oninput="render()"></div><button class="filter-btn" onclick="cycleSort()">排序</button></div><div class="filters" id="filterChips"></div></div><div class="section" id="recordList"></div></main>
  <main id="add" class="page"><div class="section"><div class="row-head"><h3>新增消費紀錄</h3></div><div class="field"><label>商品明細</label><input id="name" placeholder="例如：蠟筆小新公仔"></div><div class="grid2"><div class="field"><label>賣家</label><input id="seller" placeholder="賣家名稱"></div><div class="field"><label>平台</label><select id="platform"><option>賣貨便</option><option>蝦皮</option><option>LINE</option><option>IG</option><option>其他</option></select></div></div><div class="grid2"><div class="field"><label>本體金額</label><input id="base" type="number" value="0"></div><div class="field"><label>二補</label><input id="second" type="number" value="0"></div></div><div class="grid2"><div class="field"><label>手續費</label><input id="fee" type="number" value="0"></div><div class="field"><label>運費</label><input id="shipping" type="number" value="0"></div></div><div class="grid2"><div class="field"><label>折扣</label><input id="discount" type="number" value="0"></div><div class="field"><label>已付金額</label><input id="paid" type="number" value="0"></div></div><div class="grid2"><div class="field"><label>預計出貨日</label><input id="shipdate" type="date"></div><div class="field"><label>付款方式</label><select id="paymethod"><option>銀行轉帳</option><option>LINE Pay</option><option>信用卡</option><option>現金</option><option>其他</option></select></div></div><div class="field"><label>物流狀態</label><select id="status"><option>尚未出貨</option><option>已出貨</option><option>運送中</option><option>已到貨</option><option>待取貨</option><option>已完成</option></select></div><div class="field"><label>備註</label><textarea id="note" rows="3"></textarea></div><div class="mini-note" id="calc">應付總計 NT$0 ｜ 未付 NT$0</div><br><button class="save" onclick="saveRecord()">儲存紀錄</button></div></main>
  <main id="stats" class="page"><div class="section"><div class="hero"><div class="label">累積消費</div><div class="amount" id="statTotal">NT$0</div><div class="stats"><div class="stat"><span>已付款</span><b id="statPaid">0</b></div><div class="stat"><span>待付款</span><b id="statUnpaid">0</b></div><div class="stat"><span>訂單數</span><b id="statCount">0</b></div></div></div></div><div class="section"><div class="row-head"><h3>近 6 個月消費</h3></div><div class="chart" id="monthChart"></div></div></main>
  <main id="settings" class="page"><div class="section"><div class="setting"><div><b>備份資料</b><br><small>下載 JSON，換手機或換網址都能帶走</small></div><button onclick="exportBackup()">匯出</button></div><div class="setting"><div><b>還原資料</b><br><small>匯入「我的消費簿」JSON 備份</small></div><button onclick="document.getElementById('importFile').click()">匯入</button><input id="importFile" type="file" accept="application/json,.json" hidden></div><div class="setting"><div><b>安裝到主畫面</b><br><small>iPhone 用 Safari；Android 用 Chrome</small></div><span>›</span></div></div></main>
  <nav class="nav"><button data-page="home" class="active" onclick="go('home')">⌂<br>首頁</button><button data-page="records" onclick="go('records')">☷<br>紀錄</button><button class="plus" onclick="go('add')">＋</button><button data-page="stats" onclick="go('stats')">▥<br>統計</button><button data-page="settings" onclick="go('settings')">⚙<br>設定</button></nav>
</div>
<div id="statusSheet" class="sheet-backdrop" onclick="closeSheet(event,'statusSheet')"><div class="sheet"><div class="sheet-handle"></div><div class="sheet-title">更新物流狀態</div><div id="statusSheetSub" class="sheet-sub"></div><div id="statusOptions" class="status-list"></div><button class="sheet-cancel" onclick="hideSheet('statusSheet')">取消</button></div></div>
<div id="paymentSheet" class="sheet-backdrop" onclick="closeSheet(event,'paymentSheet')"><div class="sheet"><div class="sheet-handle"></div><div class="sheet-title" id="paymentTitle">新增付款</div><div id="paymentSub" class="sheet-sub"></div><div class="field"><label>這次付款金額</label><input id="paymentAmount" type="number" min="0"></div><div class="field"><label>付款方式</label><select id="paymentMethod"><option>銀行轉帳</option><option>LINE Pay</option><option>信用卡</option><option>現金</option><option>其他</option></select></div><button class="sheet-action" onclick="applyPayment()">儲存付款</button><button class="sheet-cancel" onclick="hideSheet('paymentSheet')">取消</button></div></div>
<div id="detailSheet" class="sheet-backdrop" onclick="closeSheet(event,'detailSheet')"><div class="sheet"><div class="sheet-handle"></div><div class="sheet-title" id="detailTitle"></div><div class="sheet-sub" id="detailSub"></div><div id="detailContent"></div><button class="sheet-cancel" onclick="hideSheet('detailSheet')">關閉</button></div></div>
<div id="editSheet" class="sheet-backdrop" onclick="closeSheet(event,'editSheet')"><div class="sheet"><div class="sheet-handle"></div><div class="sheet-title">編輯紀錄</div><div class="field"><label>商品明細</label><input id="editName"></div><div class="grid2"><div class="field"><label>賣家</label><input id="editSeller"></div><div class="field"><label>平台</label><select id="editPlatform"><option>賣貨便</option><option>蝦皮</option><option>LINE</option><option>IG</option><option>其他</option></select></div></div><div class="field"><label>訂單總額</label><input id="editTotal" type="number" min="0"></div><div class="grid2"><div class="field"><label>預計出貨日</label><input id="editShipdate" type="date"></div><div class="field"><label>付款方式</label><select id="editPaymethod"><option>銀行轉帳</option><option>LINE Pay</option><option>信用卡</option><option>現金</option><option>其他</option></select></div></div><div class="field"><label>物流狀態</label><select id="editStatus"><option>尚未出貨</option><option>已出貨</option><option>運送中</option><option>已到貨</option><option>待取貨</option><option>已完成</option></select></div><div class="field"><label>備註</label><textarea id="editNote" rows="3"></textarea></div><div class="mini-note" id="editPaidNote"></div><button class="sheet-action" onclick="saveEditRecord()">儲存修改</button><button class="sheet-cancel" onclick="hideSheet('editSheet')">取消</button></div></div>
<script>
const KEY='spend_records';
const seed=[];
let records=(JSON.parse(localStorage.getItem(KEY)||'null')||seed).map(normalizeRecord);let activeFilter='全部',sortMode=0,editingStatusIndex=null,editingPaymentIndex=null,detailIndex=null,editingRecordIndex=null;const logisticsStatuses=['尚未出貨','已出貨','運送中','已到貨','待取貨','已完成'];
function normalizeRecord(r){return {name:r.name||'未命名商品',seller:r.seller||'未填寫',platform:r.platform||'其他',total:Number(r.total||0),paid:Number(r.paid||0),status:r.status||'尚未出貨',shipdate:r.shipdate||'',paymethod:r.paymethod||'',note:r.note||'',payments:Array.isArray(r.payments)?r.payments:[],createdAt:r.createdAt||Date.now()}}
function money(n){return 'NT$'+Math.max(0,Number(n||0)).toLocaleString('zh-TW')}function unpaidOf(r){return Math.max(r.total-r.paid,0)}function isPaid(r){return unpaidOf(r)<=0}function paymentState(r){return isPaid(r)?'已付清':r.paid>0?'部分付款':'未付款'}function logisticsClass(s){return ['已完成','已到貨'].includes(s)?'green':['運送中','已出貨'].includes(s)?'blue':s==='待取貨'?'yellow':'gray'}function fmtDate(d){if(!d)return'';const x=new Date(d+'T00:00:00');return Number.isNaN(x.getTime())?d:`${x.getFullYear()}/${String(x.getMonth()+1).padStart(2,'0')}/${String(x.getDate()).padStart(2,'0')}`}function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function counts(){return {'全部':records.length,'待付款':records.filter(r=>!isPaid(r)).length,'待出貨':records.filter(r=>r.status==='尚未出貨').length,'運送中':records.filter(r=>['已出貨','運送中'].includes(r.status)).length,'待取貨':records.filter(r=>r.status==='待取貨').length,'已完成':records.filter(r=>r.status==='已完成').length}}
function renderFilters(){const c=counts(),labels=['全部','待付款','待出貨','運送中','待取貨','已完成'];document.getElementById('filterChips').innerHTML=labels.map(x=>`<button class="chip ${activeFilter===x?'on':''}" onclick="setFilter('${x}')">${x} ${c[x]}</button>`).join('')}function setFilter(f){activeFilter=f;render()}function cycleSort(){sortMode=(sortMode+1)%3;document.querySelector('.filter-btn').textContent=['最近新增','金額高→低','待付高→低'][sortMode];render()}
function filteredRecords(){const q=(document.getElementById('searchInput')?.value||'').trim().toLowerCase();let arr=records.map((r,i)=>({...r,_i:i})).filter(r=>!q||[r.name,r.seller,r.platform].some(v=>String(v).toLowerCase().includes(q)));if(activeFilter==='待付款')arr=arr.filter(r=>!isPaid(r));if(activeFilter==='待出貨')arr=arr.filter(r=>r.status==='尚未出貨');if(activeFilter==='運送中')arr=arr.filter(r=>['已出貨','運送中'].includes(r.status));if(activeFilter==='待取貨')arr=arr.filter(r=>r.status==='待取貨');if(activeFilter==='已完成')arr=arr.filter(r=>r.status==='已完成');if(sortMode===1)arr.sort((a,b)=>b.total-a.total);else if(sortMode===2)arr.sort((a,b)=>unpaidOf(b)-unpaidOf(a));else arr.sort((a,b)=>b.createdAt-a.createdAt);return arr}
function paymentBadge(r){const p=paymentState(r);return `<span class="badge ${p==='已付清'?'green':p==='部分付款'?'yellow':'red'}">${p}</span>`}function actionLabel(r){return isPaid(r)?'付款紀錄':r.paid>0?'付尾款':'新增付款'}function canComplete(r){return isPaid(r)&&['已到貨','待取貨'].includes(r.status)}
function recordCard(r,i,compact=false){const u=unpaidOf(r);return `<div class="card"><div class="card-main" onclick="openDetail(${i})"><div class="card-top"><div><div class="name">${esc(r.name)}</div><div class="meta">${esc(r.platform)} · ${esc(r.seller)}</div></div><div class="money"><span class="money-label">總額</span><b>${money(r.total)}</b></div></div><div class="badges"><button class="badge ${logisticsClass(r.status)}" onclick="event.stopPropagation();openStatusSheet(${i})">${esc(r.status)}</button>${paymentBadge(r)}</div>${r.shipdate?`<div class="shipdate">預計出貨 ${fmtDate(r.shipdate)}</div>`:''}</div>${compact?'':`<div class="payment-summary"><div class="left">已付<br><b>${money(r.paid)}</b></div><div class="unpaid">${u>0?'待付':'付款狀態'}<b>${u>0?money(u):'已付清'}</b></div></div><div class="actions"><button onclick="openPaymentSheet(${i})">${actionLabel(r)}</button>${canComplete(r)?`<button class="primary" onclick="complete(${i})">完成訂單</button>`:''}<button class="more" onclick="openDetail(${i})">詳細</button></div>`}</div>`}
function render(){renderFilters();const arr=filteredRecords();document.getElementById('recordList').innerHTML=arr.length?arr.map(r=>recordCard(r,r._i)).join(''):'<div class="empty">目前沒有紀錄</div>';document.getElementById('recent').innerHTML=records.slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,2).map(r=>recordCard(r,records.indexOf(r),true)).join('')||'<div class="empty">按下方＋新增第一筆消費</div>';const total=records.reduce((s,r)=>s+r.total,0),paid=records.reduce((s,r)=>s+Math.min(r.paid,r.total),0),unpaid=records.reduce((s,r)=>s+unpaidOf(r),0),c=counts();homeTotal.textContent=money(total);homePaid.textContent=money(paid).replace('NT$','');homeUnpaid.textContent=money(unpaid).replace('NT$','');homeWaiting.textContent=records.filter(r=>!['已到貨','已完成'].includes(r.status)).length+' 筆';qPay.textContent=c['待付款'];qShip.textContent=c['待出貨'];qTransit.textContent=c['運送中'];qPickup.textContent=c['待取貨'];statTotal.textContent=money(total);statPaid.textContent=money(paid).replace('NT$','');statUnpaid.textContent=money(unpaid).replace('NT$','');statCount.textContent=records.length;renderChart()}
function renderChart(){const now=new Date(),months=[];for(let k=5;k>=0;k--){const d=new Date(now.getFullYear(),now.getMonth()-k,1),key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;months.push({key,label:(d.getMonth()+1)+'月',sum:0})}records.forEach(r=>{const d=new Date(r.createdAt||Date.now()),key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,m=months.find(x=>x.key===key);if(m)m.sum+=r.total});const max=Math.max(...months.map(x=>x.sum),1);monthChart.innerHTML=months.map(m=>`<div class="bar" style="height:${Math.max(4,Math.round(m.sum/max*100))}%" title="${money(m.sum)}"><span>${m.label}</span></div>`).join('')}
function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(p).classList.add('active');document.querySelectorAll('.nav button[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===p));scrollTo(0,0)}
['base','second','fee','shipping','discount','paid'].forEach(id=>document.getElementById(id).addEventListener('input',calc));function calc(){const v=id=>Number(document.getElementById(id).value||0),total=Math.max(v('base')+v('second')+v('fee')+v('shipping')-v('discount'),0),unpaid=Math.max(total-v('paid'),0);calc.innerHTML=`應付總計 <b>${money(total)}</b> ｜ 未付 <b>${money(unpaid)}</b>`;return total}
function saveRecord(){const n=name.value.trim();if(!n)return alert('請先輸入商品明細');const total=calc(),p=Math.min(Number(paid.value||0),total);records.unshift(normalizeRecord({name:n,seller:seller.value.trim()||'未填寫',platform:platform.value,total,paid:p,status:status.value,shipdate:shipdate.value,paymethod:paymethod.value,note:note.value,payments:p>0?[{amount:p,method:paymethod.value,date:new Date().toISOString().slice(0,10)}]:[],createdAt:Date.now()}));persist();resetForm();go('records')}function resetForm(){name.value='';seller.value='';['base','second','fee','shipping','discount','paid'].forEach(id=>document.getElementById(id).value=0);shipdate.value='';note.value='';status.value='尚未出貨';calc()}
function openStatusSheet(i){editingStatusIndex=i;const r=records[i];statusSheetSub.textContent=r.name+'｜目前：'+r.status;statusOptions.innerHTML=logisticsStatuses.map(s=>`<button class="status-option ${r.status===s?'current':''}" onclick="setStatus('${s}')">${s}</button>`).join('');showSheet('statusSheet')}function setStatus(s){if(editingStatusIndex===null)return;records[editingStatusIndex].status=s;persist();hideSheet('statusSheet')}
function openPaymentSheet(i){editingPaymentIndex=i;const r=records[i],u=unpaidOf(r);if(isPaid(r))return openDetail(i);paymentTitle.textContent=r.paid>0?'付尾款':'新增付款';paymentSub.textContent=`${r.name}｜尚待 ${money(u)}`;paymentAmount.value=u;paymentMethod.value=r.paymethod||'銀行轉帳';showSheet('paymentSheet')}function applyPayment(){if(editingPaymentIndex===null)return;const r=records[editingPaymentIndex],real=Math.min(Math.max(0,Number(paymentAmount.value||0)),unpaidOf(r));if(real<=0)return alert('請輸入付款金額');r.paid=Math.min(r.total,r.paid+real);r.paymethod=paymentMethod.value;r.payments.push({amount:real,method:paymentMethod.value,date:new Date().toISOString().slice(0,10)});persist();hideSheet('paymentSheet')}
function openDetail(i){detailIndex=i;const r=records[i],u=unpaidOf(r);detailTitle.textContent=r.name;detailSub.textContent=`${r.platform} · ${r.seller}`;detailContent.innerHTML=`<div class="badges"><button class="badge ${logisticsClass(r.status)}" onclick="hideSheet('detailSheet');openStatusSheet(${i})">${esc(r.status)}</button>${paymentBadge(r)}</div><div class="detail-grid"><div class="detail-box"><span>訂單總額</span><b>${money(r.total)}</b></div><div class="detail-box"><span>尚待付款</span><b>${money(u)}</b></div><div class="detail-box"><span>已付款</span><b>${money(r.paid)}</b></div><div class="detail-box"><span>預計出貨</span><b>${r.shipdate?fmtDate(r.shipdate):'未設定'}</b></div></div><div class="detail-full"><div class="row"><span>付款方式</span><span>${esc(r.paymethod||'未設定')}</span></div><div class="row"><span>備註</span><span>${esc(r.note||'—')}</span></div><div class="row"><span>付款紀錄</span><span>${r.payments.length?r.payments.map(p=>`${fmtDate(p.date)} ${money(p.amount)}`).join('<br>'):'尚無紀錄'}</span></div></div><button class="sheet-action secondary" onclick="openEditSheet(${i})">編輯紀錄</button>${!isPaid(r)?`<button class="sheet-action" onclick="hideSheet('detailSheet');openPaymentSheet(${i})">${actionLabel(r)}</button>`:''}${canComplete(r)?`<button class="sheet-action" onclick="complete(${i});hideSheet('detailSheet')">完成訂單</button>`:''}`;showSheet('detailSheet')}
function openEditSheet(i){editingRecordIndex=i;const r=records[i];editName.value=r.name;editSeller.value=r.seller;editPlatform.value=['賣貨便','蝦皮','LINE','IG','其他'].includes(r.platform)?r.platform:'其他';editTotal.value=r.total;editShipdate.value=r.shipdate;editPaymethod.value=['銀行轉帳','LINE Pay','信用卡','現金','其他'].includes(r.paymethod)?r.paymethod:'其他';editStatus.value=r.status;editNote.value=r.note;editPaidNote.innerHTML=`目前已付款 <b>${money(r.paid)}</b>。付款金額請從「新增付款／付尾款」調整。`;hideSheet('detailSheet');showSheet('editSheet')}function saveEditRecord(){if(editingRecordIndex===null)return;const r=records[editingRecordIndex],n=editName.value.trim(),total=Math.max(0,Number(editTotal.value||0));if(!n)return alert('請輸入商品明細');if(total<r.paid)return alert(`訂單總額不能低於目前已付款 ${money(r.paid)}`);Object.assign(r,{name:n,seller:editSeller.value.trim()||'未填寫',platform:editPlatform.value,total,shipdate:editShipdate.value,paymethod:editPaymethod.value,status:editStatus.value,note:editNote.value});persist();hideSheet('editSheet');openDetail(editingRecordIndex)}
function complete(i){records[i].status='已完成';persist()}function showSheet(id){document.getElementById(id).classList.add('show')}function hideSheet(id){document.getElementById(id).classList.remove('show');if(id==='statusSheet')editingStatusIndex=null;if(id==='paymentSheet')editingPaymentIndex=null;if(id==='detailSheet')detailIndex=null;if(id==='editSheet')editingRecordIndex=null}function closeSheet(e,id){if(e.target.id===id)hideSheet(id)}function persist(){records=records.map(normalizeRecord);localStorage.setItem(KEY,JSON.stringify(records));render()}
function exportBackup(){const blob=new Blob([JSON.stringify({app:'我的消費簿',version:1,exportedAt:new Date().toISOString(),records},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='我的消費簿備份_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
importFile.addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const x=JSON.parse(await f.text()),arr=Array.isArray(x)?x:x.records;if(!Array.isArray(arr))throw 0;if(!confirm(`要匯入 ${arr.length} 筆資料並覆蓋目前資料嗎？`))return;records=arr.map(normalizeRecord);persist();alert('匯入完成')}catch{alert('這不是可用的「我的消費簿」備份檔')}finally{e.target.value=''}});
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();calc();
</script>
