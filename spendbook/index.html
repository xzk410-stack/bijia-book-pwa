<!doctype html>

x}.google b{font-size:18px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f4f5f9;border-radius:14px;padding:4px;margin-bottom:14px}.tabs button{border:0;background:transparent;padding:10px;border-radius:11px;font-weight:800;color:#74798a}.tabs button.on{background:#fff;color:#4c59c7;box-shadow:0 3px 10px rgba(60,70,120,.08)}label{display:block;font-size:12px;color:#707586;margin:10px 0 5px}input{width:100%;border:1px solid #dde0e8;border-radius:14px;padding:12px 13px;outline:none;font:inherit}.primary{width:100%;border:0;border-radius:15px;padding:13px;background:#6b7cfa;color:#fff;font-weight:850;font-size:15px;margin-top:14px}.link{width:100%;border:0;background:transparent;color:#6170de;font-weight:700;padding:10px;margin-top:4px}.msg{font-size:12px;line-height:1.55;margin-top:10px;color:#7b5b21;background:#fff7e5;border:1px solid #f2e2b9;padding:10px 11px;border-radius:13px}.migration{margin-top:14px;border-top:1px solid #eceef3;padding-top:14px}.migration h3{font-size:13px;margin:0 0 6px}.migration p{font-size:11px;color:#7b8090;line-height:1.55;margin:0 0 9px}.minirow{display:grid;grid-template-columns:1fr;gap:8px}.minirow button{display:flex;align-items:center;justify-content:center;border:1px solid #e1e3ea;background:#fff;color:#515767;border-radius:12px;padding:9px;font-size:12px;font-weight:750}.syncStatus{font-size:11px;color:#7b8090;margin-top:8px;text-align:center}.legal{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:13px;font-size:11px}.legal a{color:#6a7080;text-decoration:none;font-weight:700}@media(max-width:520px){.topbar{padding:8px 10px}.account small{max-width:170px}.tools button{padding:7px 8px;font-size:11px}.card{padding:20px;border-radius:24px}}</style></head><body><div class="shell"><div id="topbar" class="topbar"><div class="account"><b>我的消費簿 · 雲端版</b><small id="accountEmail"></small></div><div class="tools"><button id="cloudState" class="cloud">雲端同步</button><button onclick="logout()">登出</button></div></div><iframe id="appFrame" src="./app.html" hidden></iframe></div><section id="auth" class="auth"><div class="card"><div class="brand"><div class="icon"><img src="./icon.svg" alt=""></div><h1>我的消費簿</h1><p>與收藏雷達共用同一組 Email／密碼。<br>註冊需完成 Email 驗證，登入後資料會同步到雲端。</p></div><button class="google" onclick="signInWithGoogle()"><b>G</b>使用 Google 登入</button><div class="tabs"><button id="loginTab" class="on" onclick="setMode('login')">登入</button><button id="signupTab" onclick="setMode('signup')">註冊</button></div><div id="nameWrap" hidden><label>暱稱</label><input id="displayName" placeholder="輸入暱稱"></div><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com"><label>密碼</label><input id="password" type="password" minlength="6" autocomplete="current-password" placeholder="至少 6 個字元"><div id="message" class="msg" hidden></div><button id="submitBtn" class="primary" onclick="submitAuth()">登入</button><button class="link" onclick="resetPassword()">忘記密碼？</button><div class="migration"><h3>以前用過舊版？</h3><p>如果手邊有舊版匯出的 JSON 備份，可以直接匯入；新版會與目前雲端資料合併，不會清空原紀錄。</p><div class="minirow"><button onclick="document.getElementById('legacyFile').click()">匯入舊備份</button></div><input id="legacyFile" type="file" accept="application/json,.json" hidden><div id="syncStatus" class="syncStatus"></div></div><div class="legal"><a href="https://save-radar-gold.vercel.app/hub/privacy">隱私權</a><a href="https://save-radar-gold.vercel.app/hub/terms">使用說明</a><a href="https://save-radar-gold.vercel.app/hub/delete-account">刪除帳號</a></div></div></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./cloud.js"></script></body></html>
