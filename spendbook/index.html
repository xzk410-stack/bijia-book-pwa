<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f4">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>我的消費簿</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:#f6f7f4;color:#25332e}button,input{font:inherit}button{cursor:pointer}body{overflow:hidden}.shell{height:100%;display:flex;flex-direction:column}.topbar{display:none;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:rgba(255,255,255,.96);border-bottom:1px solid #e5e8e3}.topbar.show{display:flex}.account{min-width:0}.account b{display:block;font-size:13px}.account small{display:block;color:#737c77;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}.tools{display:flex;gap:7px}.tools button{border:1px solid #dfe5e1;background:#fff;border-radius:12px;padding:8px 10px;font-weight:700;color:#56635d}.cloud{color:#356f5e!important;background:#edf7f2!important;border-color:#d5eadf!important}iframe{border:0;width:100%;flex:1;background:#f7f7fb}
.auth{position:fixed;inset:0;display:flex;justify-content:center;align-items:flex-start;padding:max(22px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));background:linear-gradient(180deg,#fafbf8 0%,#f1f5f2 100%);z-index:20;overflow:auto}.auth.hidden{display:none}.card{width:min(420px,100%);margin:auto 0;background:rgba(255,255,255,.98);border:1px solid #e3e8e4;border-radius:26px;padding:22px;box-shadow:0 18px 52px rgba(48,70,61,.09)}
.brand{text-align:center;margin-bottom:16px}.icon{width:64px;height:64px;border-radius:20px;margin:0 auto 10px;display:grid;place-items:center;background:linear-gradient(145deg,#e9f3ef,#f7fbf9);box-shadow:inset 0 0 0 1px rgba(68,112,94,.04)}.icon img{width:48px;height:48px}.brand h1{font-size:26px;line-height:1.2;margin:0 0 7px;letter-spacing:-.02em}.brand p{font-size:12.5px;color:#737d78;line-height:1.55;margin:0}.sharedBadge{display:inline-flex;align-items:center;gap:5px;margin-top:9px;padding:6px 9px;border-radius:999px;background:#eef6f2;color:#487263;font-size:11px;font-weight:800}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f1f4f2;border-radius:14px;padding:4px;margin-bottom:15px}.tabs button{border:0;background:transparent;padding:9px 10px;border-radius:11px;font-weight:800;color:#737e78}.tabs button.on{background:#fff;color:#3f7162;box-shadow:0 3px 10px rgba(60,90,70,.08)}label{display:block;font-size:12px;color:#68736d;margin:10px 0 5px;font-weight:700}input{width:100%;border:1px solid #dce2de;border-radius:14px;padding:12px 13px;outline:none;background:#fff;color:#24352f;transition:border-color .15s,box-shadow .15s}input:focus{border-color:#8aafa2;box-shadow:0 0 0 3px rgba(67,119,101,.10)}.primary{width:100%;border:0;border-radius:15px;padding:13px;background:linear-gradient(135deg,#5b8f7f,#3f7162);color:#fff;font-weight:850;font-size:15px;margin-top:14px;box-shadow:0 8px 20px rgba(63,113,98,.18)}.primary:disabled,.google:disabled{opacity:.62;cursor:default}.link{width:100%;border:0;background:transparent;color:#3f7162;font-weight:750;padding:9px;margin-top:3px}.msg{font-size:12px;line-height:1.55;margin-top:10px;color:#765927;background:#fff7e5;border:1px solid #f2e2b9;padding:10px 11px;border-radius:13px}.divider{display:flex;align-items:center;gap:10px;color:#989f9b;font-size:11px;margin:10px 0}.divider:before,.divider:after{content:"";height:1px;background:#ecefeb;flex:1}.google{display:flex;width:100%;border:1px solid #dfe4e1;background:#fff;border-radius:15px;padding:12px 13px;font-size:14px;font-weight:850;color:#34443d;align-items:center;justify-content:center;gap:10px;box-shadow:0 2px 8px rgba(53,76,61,.04)}
.migration{margin-top:14px;border:1px solid #e6eae7;border-radius:14px;background:#fafbfa;overflow:hidden}.migration summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;cursor:pointer;font-size:12px;font-weight:800;color:#596660}.migration summary::-webkit-details-marker{display:none}.migration summary:after{content:"＋";font-size:17px;line-height:1;color:#819087}.migration[open] summary:after{content:"－"}.migrationBody{border-top:1px solid #edf0ed;padding:11px 12px 12px}.migrationBody p{font-size:11px;color:#7b837e;line-height:1.55;margin:0 0 9px}.minirow{display:grid;grid-template-columns:1fr;gap:8px}.minirow button{display:flex;align-items:center;justify-content:center;border:1px solid #dfe4e1;background:#fff;color:#505d57;border-radius:12px;padding:9px;font-size:12px;font-weight:750}.syncStatus{font-size:11px;color:#7b837e;margin-top:8px;text-align:center}.legal{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:13px;font-size:11px}.legal a{color:#6a746f;text-decoration:none;font-weight:700}
@media(max-width:520px){.auth{padding-left:14px;padding-right:14px}.card{padding:19px 18px;border-radius:23px}.icon{width:60px;height:60px;border-radius:19px}.icon img{width:45px;height:45px}.brand h1{font-size:24px}.brand{margin-bottom:14px}.topbar{padding:8px 10px}.account small{max-width:170px}.tools button{padding:7px 8px;font-size:11px}}
</style>
</head>
<body>
<div class="shell">
  <div id="topbar" class="topbar">
    <div class="account"><b>我的消費簿 · 雲端版</b><small id="accountEmail"></small></div>
    <div class="tools"><button id="cloudState" class="cloud">雲端同步</button><button type="button" onclick="logout()">登出</button></div>
  </div>
  <iframe id="appFrame" src="./app.html" hidden title="我的消費簿"></iframe>
</div>
<section id="auth" class="auth">
  <div class="card">
    <div class="brand">
      <div class="icon"><img src="./icon.svg" alt=""></div>
      <h1>我的消費簿</h1>
      <p>把每一筆購買、付款和到貨狀態留在同一個地方。</p>
      <div class="sharedBadge">☁️ 與收藏雷達共用登入帳號</div>
    </div>

    <div class="tabs">
      <button id="loginTab" class="on" type="button" onclick="setMode('login')">登入</button>
      <button id="signupTab" type="button" onclick="setMode('signup')">註冊</button>
    </div>

    <div id="nameWrap" hidden><label>暱稱</label><input id="displayName" placeholder="輸入暱稱" autocomplete="nickname"></div>
    <label>Email</label><input id="email" type="email" autocomplete="email" inputmode="email" placeholder="name@example.com">
    <label>密碼</label><input id="password" type="password" minlength="6" autocomplete="current-password" placeholder="至少 6 個字元">
    <div id="message" class="msg" hidden></div>
    <button id="submitBtn" class="primary" type="button" onclick="submitAuth()">登入</button>
    <button class="link" type="button" onclick="resetPassword()">忘記密碼？</button>

    <div class="divider">或</div>
    <button class="google" type="button" onclick="signInWithGoogle()"><svg aria-hidden="true" viewBox="0 0 18 18" style="width:20px;height:20px;display:block;flex:0 0 auto"><path fill="#4285F4" d="M17.64 9.205c0-.639-.057-1.252-.164-1.841H9v3.482h4.844c-.209 1.125-.844 2.078-1.797 2.716v2.258h2.908c1.702-1.567 2.685-3.878 2.685-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.468-.806 5.955-2.18l-2.908-2.258c-.806.54-1.835.859-3.047.859-2.344 0-4.328-1.585-5.037-3.713H.956v2.332A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.963 10.708A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.281-1.708V4.96H.956A9 9 0 0 0 0 9c0 1.452.347 2.827.956 4.04l3.007-2.332z"/><path fill="#EA4335" d="M9 3.579c1.321 0 2.507.454 3.441 1.346l2.581-2.581C13.464.892 11.426 0 9 0A9 9 0 0 0 .956 4.96l3.007 2.332C4.672 5.164 6.656 3.579 9 3.579z"/></svg><span>使用 Google 登入</span></button>

    <details class="migration">
      <summary>以前用過舊版？</summary>
      <div class="migrationBody">
        <p>如果手邊有舊版匯出的 JSON 備份，可以直接匯入；新版會與目前雲端資料合併，不會清空原紀錄。</p>
        <div class="minirow"><button type="button" onclick="document.getElementById('legacyFile').click()">匯入舊備份</button></div>
        <input id="legacyFile" type="file" accept="application/json,.json" hidden>
        <div id="syncStatus" class="syncStatus"></div>
      </div>
    </details>

    <div class="legal"><a href="https://save-radar-gold.vercel.app/hub/privacy">隱私權</a><a href="https://save-radar-gold.vercel.app/hub/terms">使用說明</a><a href="https://save-radar-gold.vercel.app/delete-account">刪除帳號</a></div>
  </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./cloud.js"></script>
</body>
</html>
