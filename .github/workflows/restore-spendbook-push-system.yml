name: Restore Spendbook push notification system

on:
  push:
    paths:
      - '.github/workflows/restore-spendbook-push-system.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore cloud deadline mapping and notification bridge
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          cloud=Path('spendbook/cloud.js')
          s=cloud.read_text(encoding='utf-8')
          s=s.replace("shipdate:r.ship_date||'',paymethod:r.payment_method||'',note:r.note||'',","shipdate:r.ship_date||'',paymentDueDate:r.payment_due_date||'',paymethod:r.payment_method||'',note:r.note||'',",1)
          s=s.replace("ship_date:r.shipdate||null,payment_method:r.paymethod||'',note:r.note||''","ship_date:r.shipdate||null,payment_due_date:r.paymentDueDate||null,payment_method:r.paymethod||'',note:r.note||''",1)
          cloud.write_text(s,encoding='utf-8')
          index=Path('spendbook/index.html')
          t=index.read_text(encoding='utf-8')
          needle='<script src="./cloud.js?v=auth-boot-20260909"></script>'
          if 'notification-cloud.js' not in t:
              t=t.replace(needle,needle+'\n<script src="./notification-cloud.js?v=20260914"></script>',1)
          index.write_text(t,encoding='utf-8')
          PY

      - name: Commit restored notification connection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add spendbook/cloud.js spendbook/index.html
          git diff --cached --check
          git commit -m 'Reconnect Spendbook deadline notifications to cloud' || exit 0
          git push
