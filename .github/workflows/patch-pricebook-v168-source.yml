name: Patch Pricebook v1.6.8 source

on:
  push:
    paths:
      - '.github/workflows/patch-pricebook-v168-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch MainActivity source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android/pricebook/app/src/main/java/com/bijiabu/app/MainActivity.java')
          s = p.read_text(encoding='utf-8')
          needle = 'webView.addJavascriptInterface(new AndroidBridge(), "Android");'
          registration = 'webView.addJavascriptInterface(new OrderOcrBridge(webView), "OrderOCR");'
          if registration not in s:
              if needle not in s:
                  raise SystemExit('Android bridge registration point not found')
              s = s.replace(needle, needle + '\n        ' + registration, 1)
          s = s.replace('BijiaBook/1.6.7 (Android)', 'BijiaBook/1.6.8 (Android)')
          p.write_text(s, encoding='utf-8')
          PY
          grep -q 'OrderOcrBridge(webView)' android/pricebook/app/src/main/java/com/bijiabu/app/MainActivity.java
          grep -q 'BijiaBook/1.6.8 (Android)' android/pricebook/app/src/main/java/com/bijiabu/app/MainActivity.java
      - name: Commit source patch
        run: |
          git config user.name 'xzk410-stack'
          git config user.email 'xzk410@gmail.com'
          git add android/pricebook/app/src/main/java/com/bijiabu/app/MainActivity.java
          if git diff --cached --quiet; then
            echo 'Source already patched.'
          else
            git commit -m 'Enable on-device order OCR in 比價簿 v1.6.8 source'
            git push
          fi
