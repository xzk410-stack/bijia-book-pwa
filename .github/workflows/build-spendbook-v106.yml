name: Build Spendbook Android v1.0.6

on:
  push:
    paths:
      - '.github/workflows/build-spendbook-v106.yml'
      - 'android/spendbook/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Prepare release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.BIJIABU_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BIJIABU_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BIJIABU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BIJIABU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${STORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo 'Release signing secrets are not configured.' >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/spendbook-release.jks"
          echo "BIJIABU_KEYSTORE=$RUNNER_TEMP/spendbook-release.jks" >> "$GITHUB_ENV"
          echo "BIJIABU_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "BIJIABU_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "BIJIABU_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build v1.0.6 release APK
        working-directory: android/spendbook
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/spendbook-v1.0.6.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spendbook-v1.0.6-apk
          path: spendbook-v1.0.6.apk
          retention-days: 7
          if-no-files-found: error
