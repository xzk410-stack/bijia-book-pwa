name: Lock TripMate invite UI to owner

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/lock-trip-invite-ui-owner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make invite UI owner-only
        shell: python
        run: |
          from pathlib import Path
          p = Path('tripmate-live/index.html')
          s = p.read_text(encoding='utf-8')
          old = "目前權限：${roleLabel(state.roles[state.trip.id])}</div>${canEdit()?`"
          new = "目前權限：${roleLabel(state.roles[state.trip.id])}</div>${state.roles[state.trip.id]==='owner'?`"
          if old not in s:
              raise SystemExit('invite permission anchor not found')
          s = s.replace(old, new, 1)
          s = s.replace("你目前是僅查看成員，不能建立邀請。", "只有旅程擁有者可以建立邀請。", 1)
          p.write_text(s, encoding='utf-8')
      - name: Verify
        run: |
          grep -q "state.roles\[state.trip.id\]==='owner'" tripmate-live/index.html
          grep -q "只有旅程擁有者可以建立邀請" tripmate-live/index.html
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tripmate-live/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Make TripMate invites owner-only in UI"
          git push
