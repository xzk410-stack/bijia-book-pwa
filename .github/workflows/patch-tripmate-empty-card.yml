name: Patch TripMate empty-card add action

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-tripmate-empty-card.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make the airplane empty card create a trip
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tripmate-live/index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'data-trip-empty-card="1"'
          if marker not in s:
              old = '<p>行程、票券、行李與收藏都使用同一套原有雲端資料。</p></div>${tripListHtml()}'
              new = '<p>行程、票券、行李與收藏都使用同一套原有雲端資料。</p></div><button type="button" class="empty" data-new-trip data-trip-empty-card="1" style="width:100%;display:block;margin:0 0 14px;color:var(--muted)"><span class="big" style="display:block">✈️</span><b>還沒有旅行</b><span style="display:block">點這張卡片建立第一趟旅行，行李預設清單也會自動準備好。</span></button>${tripListHtml()}'
              if old not in s:
                  raise SystemExit('Target no-trip hero block was not found; refusing a broad patch.')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Verify patch
        shell: bash
        run: |
          grep -q 'data-trip-empty-card="1"' tripmate-live/index.html
          grep -q 'data-new-trip' tripmate-live/index.html
          grep -q '還沒有旅行' tripmate-live/index.html

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'xzk410-stack'
          git config user.email 'xzk410@gmail.com'
          rm .github/workflows/patch-tripmate-empty-card.yml
          git add tripmate-live/index.html .github/workflows/patch-tripmate-empty-card.yml
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Make TripMate empty airplane card create a trip'
          git push origin HEAD:main
