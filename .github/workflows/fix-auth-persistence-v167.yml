name: Fix Pricebook auth persistence v1.6.7

on:
  push:
    paths:
      - '.github/workflows/fix-auth-persistence-v167.yml'
      - 'scripts/fix_auth_v167.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v1.6.7 auth persistence patch
        run: python3 scripts/fix_auth_v167.py
      - name: Commit v1.6.7 auth persistence fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pricebook/cloud.js android/pricebook/app/src/main/java/com/bijiabu/app/MainActivity.java android/pricebook/app/build.gradle.kts
          git diff --cached --check
          git commit -m 'Keep 比價簿 signed in across app restarts'
          git push
