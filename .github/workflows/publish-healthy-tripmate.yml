name: Publish healthy TripMate source

on:
  push:
    paths:
      - '.github/workflows/publish-healthy-tripmate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified restored TripMate
        shell: bash
        run: |
          curl --fail --silent --show-error --location 'https://dfvrlddywisvlnsqdjuf.supabase.co/functions/v1/tripmate-source-export' -o /tmp/tripmate.html
          grep -qi '<!doctype html' /tmp/tripmate.html
          grep -q '歡迎回到旅伴' /tmp/tripmate.html
          grep -q 'saved_places' /tmp/tripmate.html
          if grep -q '}tate' /tmp/tripmate.html; then exit 1; fi
          if grep -q 'a}ync' /tmp/tripmate.html; then exit 1; fi
      - name: Build healthy public TripMate
        run: python3 scripts/publish_healthy_tripmate.py
      - name: Commit healthy public TripMate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tripmate-live
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restore healthy TripMate web app"
          git push
