name: Build standalone TripMate page

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-tripmate-inline.yml'
      - 'scripts/build_tripmate_inline.py'
      - 'travelmate/app/payload/**'
      - 'travelmate/app/google-auth-patch.js'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate standalone TripMate pages
        run: python3 scripts/build_tripmate_inline.py
      - name: Commit generated pages
        shell: bash
        run: |
          if git diff --quiet -- travelmate/app/index.html tripmate-live; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add travelmate/app/index.html tripmate-live
          git commit -m "Publish standalone TripMate pages"
          git push
