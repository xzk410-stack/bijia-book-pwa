name: Publish fresh TripMate route

on:
  push:
    paths:
      - '.github/workflows/publish-tripmate-fresh.yml'
      - 'travelmate/app/payload/**'
      - 'travelmate/app/google-auth-patch.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone fresh route
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, re, html

          root = Path('.')
          payload_dir = root / 'travelmate' / 'app' / 'payload'
          parts = ''.join((payload_dir / f'part{i:02d}.txt').read_text(encoding='utf-8') for i in range(1, 7))
          raw = gzip.decompress(base64.b64decode(''.join(parts.split()))).decode('utf-8')
          patch = (root / 'travelmate' / 'app' / 'google-auth-patch.js').read_text(encoding='utf-8')

          # Keep relative resources pointing to the original stable asset folder, but run from a brand-new route.
          if '<head>' in raw:
              raw = raw.replace('<head>', '<head>\n<base href="https://xzk410-stack.github.io/bijia-book-pwa/travelmate/app/">\n<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">', 1)

          cleanup = r'''
<script data-tripmate-fresh-ui>
(() => {
  const tidy = () => {
    const nodes = [...document.querySelectorAll('body *')];
    for (const el of nodes) {
      const text = (el.textContent || '').replace(/\s+/g, ' ').trim();
      if (!text) continue;
      if ((text.includes('Android 1.2.7') || text.includes('定位修復版') || text.includes('安裝最新版')) && text.length < 500) {
        let card = el;
        for (let i = 0; i < 4 && card.parentElement; i++, card = card.parentElement) {
          const t = (card.textContent || '').replace(/\s+/g, ' ');
          if ((t.includes('Android 1.2.7') || t.includes('定位修復版')) && t.length < 700) {
            card.style.display = 'none';
            break;
          }
        }
      }
    }
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', tidy, {once:true});
  else tidy();
  const mo = new MutationObserver(tidy);
  mo.observe(document.documentElement, {subtree:true, childList:true});
  setTimeout(() => mo.disconnect(), 12000);
})();
</script>
'''
          injected = '\n<script data-tripmate-google-inline>\n' + patch + '\n</script>\n' + cleanup
          if '</body>' in raw:
              raw = raw.replace('</body>', injected + '</body>', 1)
          else:
              raw += injected

          out = root / 'tripmate-live'
          out.mkdir(exist_ok=True)
          (out / 'index.html').write_text(raw, encoding='utf-8')
          (out / '.nojekyll').write_text('', encoding='utf-8')
          # Keep the same icon available at the fresh route.
          (out / 'icon.svg').write_text((root / 'travelmate' / 'app' / 'icon.svg').read_text(encoding='utf-8'), encoding='utf-8')
          manifest = (root / 'travelmate' / 'app' / 'manifest.webmanifest').read_text(encoding='utf-8')
          manifest = re.sub(r'"start_url"\s*:\s*"[^"]*"', '"start_url":"./"', manifest)
          (out / 'manifest.webmanifest').write_text(manifest, encoding='utf-8')
          PY
      - name: Commit fresh route
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tripmate-live
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Publish fresh TripMate route"
            git push
          fi
